<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球数据网络 | Canvas Demo</title>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0a0e27; }
  body { overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .scene { position: relative; min-height: 100vh; overflow: hidden; background: linear-gradient(135deg, #0a0e27 0%, #101333 52%, #1a1a3e 100%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption { position: absolute; z-index: 2; left: clamp(24px, 7vw, 110px); top: 50%; transform: translateY(-50%); max-width: 390px; pointer-events: none; }
  .eyebrow { margin: 0 0 18px; color: #00f0ff; font-size: 12px; letter-spacing: 0.35em; }
  h1 { margin: 0; color: #fff; font-size: clamp(32px, 4.5vw, 68px); line-height: 1.12; font-weight: 500; text-shadow: 0 0 24px rgba(0,240,255,.24); }
  .caption p { margin: 22px 0 0; color: rgba(219,231,255,.68); font-size: 15px; line-height: 1.9; }
  .stage { position: absolute; z-index: 2; left: clamp(24px, 7vw, 110px); bottom: 34px; color: rgba(219,231,255,.48); font-size: 11px; letter-spacing: .16em; }
  .stage strong { color: #ffd700; font-weight: 500; }
  @media (max-width: 700px) {
    .caption { top: 25%; transform: none; max-width: 270px; }
    .caption p { font-size: 13px; }
    .stage { bottom: 20px; }
  }
</style>
</head>
<body>
<main class="scene">
  <canvas id="network" aria-label="中国连接全球的数据网络动画"></canvas>
  <div class="caption">
    <p class="eyebrow">CHENBRIDGE / GLOBAL NETWORK</p>
    <h1>中国制造<br>连接全球</h1>
    <p>数字能力让每一次专业交付，都能抵达世界另一端。</p>
  </div>
  <div class="stage">SYSTEM STATUS / <strong id="stage">INITIALIZING</strong></div>
</main>
<script>
(() => {
  const canvas = document.getElementById('network');
  const ctx = canvas.getContext('2d');
  const stageLabel = document.getElementById('stage');
  const TAU = Math.PI * 2;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let width = 0, height = 0, dpr = 1, startTime = performance.now();
  let pointer = { x: -1000, y: -1000 };

  const nodes = [[0.04,0.42],[0.12,0.28],[0.22,0.55],[0.31,0.36],[0.42,0.62],[0.51,0.30],[0.61,0.50],[0.70,0.34],[0.77,0.63],[0.86,0.28],[0.94,0.50]];
  const links = [
    [0,1],[0,2],[1,3],[2,3],[2,4],[3,5],[4,6],[5,6],[5,7],[6,8],[7,9],[8,10],[4,5],[6,7]
  ];
  const stars = Array.from({ length: 90 }, (_, index) => ({
    x: (index * 71 % 997) / 997, y: (index * 43 % 991) / 991,
    radius: 0.35 + (index % 4) * 0.22, phase: index * 0.73
  }));

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.floor(width * dpr); canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function project([x, y]) {
    const mobile = width < 700;
    const mapLeft = mobile ? width * 0.06 : width * 0.36;
    const mapWidth = mobile ? width * 0.88 : width * 0.58;
    const mapTop = mobile ? height * 0.34 : height * 0.18;
    const mapHeight = mobile ? height * 0.48 : height * 0.62;
    const drift = mobile ? 0 : Math.sin((performance.now() - startTime) * 0.00015) * 4;
    return { x: mapLeft + x * mapWidth + drift, y: mapTop + y * mapHeight };
  }
  function drawPath(points, color, lineWidth, alpha, reveal = 1) {
    if (reveal <= 0) return;
    const visibleCount = Math.max(2, Math.ceil(points.length * Math.min(reveal, 1)));
    ctx.beginPath();
    points.slice(0, visibleCount).forEach((point, index) => {
      const p = project(point);
      if (index === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    });
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = lineWidth; ctx.stroke(); ctx.globalAlpha = 1;
  }
  function glowDot(point, color, radius, alpha = 1) {
    const p = project(point);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = color; ctx.shadowBlur = radius * 5; ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, TAU); ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  }
  function linePoint(start, end, progress) {
    return [start[0] + (end[0] - start[0]) * progress, start[1] + (end[1] - start[1]) * progress];
  }
  function draw() {
    const elapsed = (performance.now() - startTime) / 1000;
    const cycle = reduceMotion.matches ? 20 : elapsed % 20;
    const pulse = 0.5 + Math.sin(elapsed * 2.1) * 0.5;
    ctx.clearRect(0, 0, width, height);
    const background = ctx.createRadialGradient(width * 0.72, height * 0.45, 0, width * 0.72, height * 0.45, Math.max(width, height) * .8);
    background.addColorStop(0, '#182458'); background.addColorStop(.48, '#111638'); background.addColorStop(1, '#070b20');
    ctx.fillStyle = background; ctx.fillRect(0, 0, width, height);

    stars.forEach(star => {
      const twinkle = 0.15 + (0.18 + pulse * 0.18) * (0.5 + Math.sin(elapsed * .7 + star.phase) * .5);
      ctx.beginPath(); ctx.arc(width * star.x, height * star.y, star.radius, 0, TAU);
      ctx.fillStyle = `rgba(145,205,255,${twinkle})`; ctx.fill();
    });

    links.forEach(([sourceIndex, targetIndex], index) => {
      const source = nodes[sourceIndex], target = nodes[targetIndex];
      const appear = Math.min(1, Math.max(0, (cycle - 2 - index * .18) / 1.5));
      if (!appear) return;
      const start = project(source), end = project(target);
      const gradient = ctx.createLinearGradient(start.x, start.y, end.x, end.y);
      gradient.addColorStop(0, '#ffd700'); gradient.addColorStop(.42, '#00f0ff'); gradient.addColorStop(1, '#9b5cff');
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .42 * appear;
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 9; ctx.lineWidth = 1.35; ctx.strokeStyle = gradient;
      ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(end.x, end.y); ctx.stroke(); ctx.restore();
      const progress = (elapsed * (.13 + index * .006) + index * .17) % 1;
      glowDot(linePoint(source, target, progress), index % 2 ? '#00f0ff' : '#ffd700', 2.1, appear);
    });

    nodes.forEach((node, index) => glowDot(node, index === 0 ? '#ffd700' : '#00f0ff', 2.2 + pulse * 1.2, .65 + pulse * .3));

    const phase = cycle < 3 ? 'WORLD MAP ONLINE' : cycle < 6 ? 'CHINA NODE ACTIVE' : cycle < 10 ? 'REGIONS SYNCHRONIZING' : cycle < 16 ? 'DATA ROUTES CONNECTING' : 'GLOBAL NETWORK LIVE';
    stageLabel.textContent = phase;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  canvas.addEventListener('pointermove', event => { pointer.x = event.clientX; pointer.y = event.clientY; });
  canvas.addEventListener('pointerleave', () => { pointer.x = -1000; pointer.y = -1000; });
  resize(); draw();
})();
</script>
</body>
</html>
